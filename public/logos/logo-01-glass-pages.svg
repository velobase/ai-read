<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Squircle Base Gradient: Deep Royal Cobalt to Midnight Sapphire -->
    <linearGradient id="bg-01" x1="28" y1="16" x2="228" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Ambient Top-Left Glow inside Squircle -->
    <radialGradient id="ambient-01" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(68 48) rotate(48) scale(190 170)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-Right Subsurface Rim Glow -->
    <radialGradient id="rim-glow-01" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(204 216) rotate(-135) scale(140 120)">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Outer Border Specular -->
    <linearGradient id="border-01" x1="32" y1="16" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.4" />
    </linearGradient>

    <!-- Back Page (Deep Sapphire Glass) -->
    <linearGradient id="page-back-01" x1="60" y1="54" x2="184" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.75" />
    </linearGradient>

    <!-- Middle Page (Luminous Cyan-Azure Prism) -->
    <linearGradient id="page-mid-01" x1="66" y1="52" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="48%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="page-mid-edge-01" x1="72" y1="48" x2="192" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Front Sculpted Leaf-Page (Frosted Alabaster Glass) -->
    <linearGradient id="page-front-01" x1="76" y1="56" x2="202" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#F0F9FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.78" />
    </linearGradient>

    <!-- Front Page Specular Bevel Stroke -->
    <linearGradient id="page-front-stroke-01" x1="80" y1="56" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.4" />
    </linearGradient>

    <!-- Left Open Wing (Soft Translucent Glass) -->
    <linearGradient id="left-wing-01" x1="46" y1="74" x2="118" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.35" />
    </linearGradient>

    <!-- Spine Pillar Gradient -->
    <linearGradient id="spine-01" x1="92" y1="62" x2="92" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft 3D Layer Shadow -->
    <filter id="shadow-deep-01" x="-20%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#030712" flood-opacity="0.55" />
    </filter>
    <filter id="shadow-page-01" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-6" dy="10" stdDeviation="8" flood-color="#091534" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- 3D App Icon Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bg-01)" />
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#ambient-01)" />
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#rim-glow-01)" />
  <rect x="17.25" y="17.25" width="221.5" height="221.5" rx="52.75" stroke="url(#border-01)" stroke-width="2.5" />

  <!-- Subtle Inner Top Specular Arc -->
  <path d="M52 20H204C220 20 232 30 235 44C230 29 217 22 200 22H56C39 22 26 29 21 44C24 30 36 20 52 20Z" fill="#FFFFFF" fill-opacity="0.22" />

  <g filter="url(#shadow-deep-01)">
    <!-- Left Counter-Balance Page Wing (Creates Open Book Anchor) -->
    <path d="M92 78C74 72 56 76 46 84V184C56 176 74 174 92 182V78Z" fill="url(#left-wing-01)" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Layer 1: Back Sapphire Page (Fanning High & Left) -->
    <path d="M92 74C92 60 124 44 166 44C172 44 176 48 176 54V156C176 168 136 176 92 186V74Z" fill="url(#page-back-01)" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Layer 2: Middle Cyan Prism Page (Fanning Mid) -->
    <g filter="url(#shadow-page-01)">
      <path d="M92 80C92 64 134 50 186 52C193 52.3 197 57 197 64V164C197 177 148 184 92 192V80Z" fill="url(#page-mid-01)" stroke="url(#page-mid-edge-01)" stroke-width="2" />
    </g>

    <!-- Layer 3: Front Frosted Glass Leaf-Page (Curving Forward & Sculpted Like a Leaf) -->
    <g filter="url(#shadow-page-01)">
      <path d="M92 88C92 72 142 62 202 66C209 66.5 213 71.5 212 78.5C208 118 198 152 174 174C152 194 122 198 92 198V88Z" fill="url(#page-front-01)" stroke="url(#page-front-stroke-01)" stroke-width="2.5" />

      <!-- Subtle Engraved Leaf-Vein / Typography Lines on Front Frosted Page -->
      <path d="M116 108C142 104 168 102 188 103" stroke="#0284C7" stroke-opacity="0.28" stroke-width="4.5" stroke-linecap="round" />
      <path d="M116 128C138 124 160 122 178 123" stroke="#0284C7" stroke-opacity="0.22" stroke-width="4.5" stroke-linecap="round" />
      <path d="M116 148C134 145 148 144 162 145" stroke="#0284C7" stroke-opacity="0.16" stroke-width="4.5" stroke-linecap="round" />

      <!-- Rolled Page-Corner Highlight (3D Leaf Curl Specular) -->
      <path d="M211 76C207 114 196 148 173 170C188 150 196 122 198 84C198.5 76 204 72 211 76Z" fill="#FFFFFF" fill-opacity="0.65" />
    </g>

    <!-- 3D Cylindrical Luminous Spine -->
    <rect x="87" y="68" width="10" height="134" rx="5" fill="url(#spine-01)" />
    <rect x="89" y="70" width="3" height="130" rx="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  </g>
</svg>
