<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Anodized Space-Black & Midnight Slate Base -->
    <linearGradient id="bg-04" x1="32" y1="16" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161F33" />
      <stop offset="50%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Volumetric Central Core Glow -->
    <radialGradient id="core-glow-04" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 112) rotate(90) scale(116 96)">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Bevel Rim -->
    <linearGradient id="border-04" x1="28" y1="16" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5" />
    </linearGradient>

    <!-- Left Anodized Slate Wing -->
    <linearGradient id="wing-left-04" x1="48" y1="68" x2="124" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Right Anodized Slate Wing -->
    <linearGradient id="wing-right-04" x1="208" y1="68" x2="132" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Inner Bevel Bounce Light (Left & Right) -->
    <linearGradient id="bounce-left-04" x1="124" y1="64" x2="54" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Rising Luminous AI Bookmark / Feather Prism -->
    <linearGradient id="beam-prism-04" x1="128" y1="42" x2="128" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#93C5FD" />
      <stop offset="68%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="beam-right-facet-04" x1="128" y1="42" x2="162" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="glow-filter-04" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B82F6" flood-opacity="0.65" />
    </filter>
    <filter id="wing-shadow-04" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#02040A" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bg-04)" />
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#core-glow-04)" />
  <rect x="17.25" y="17.25" width="221.5" height="221.5" rx="52.75" stroke="url(#border-04)" stroke-width="2.5" />

  <!-- Subtle Perspective Grid Horizon Lines -->
  <path d="M36 196H220" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1" />

  <g filter="url(#wing-shadow-04)">
    <!-- Left Precision-Machined Book Wing -->
    <path d="M48 80C48 73 54 68 61 70C84 76 104 88 120 106V198C104 182 82 170 56 164C51 163 48 158 48 153V80Z" fill="url(#wing-left-04)" stroke="url(#bounce-left-04)" stroke-width="2.2" />

    <!-- Right Precision-Machined Book Wing -->
    <path d="M208 80C208 73 202 68 195 70C172 76 152 88 136 106V198C152 182 174 170 200 164C205 163 208 158 208 153V80Z" fill="url(#wing-right-04)" stroke="url(#bounce-left-04)" stroke-width="2.2" />

    <!-- Inner Illuminated Page Ribs (Left) -->
    <path d="M66 96C82 101 96 109 108 120" stroke="#60A5FA" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round" />
    <path d="M66 116C82 121 96 129 108 140" stroke="#60A5FA" stroke-opacity="0.26" stroke-width="3" stroke-linecap="round" />
    <path d="M66 136C78 140 90 146 100 154" stroke="#60A5FA" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />

    <!-- Inner Illuminated Page Ribs (Right) -->
    <path d="M190 96C174 101 160 109 148 120" stroke="#60A5FA" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round" />
    <path d="M190 116C174 121 160 129 148 140" stroke="#60A5FA" stroke-opacity="0.26" stroke-width="3" stroke-linecap="round" />
    <path d="M190 136C178 140 166 146 156 154" stroke="#60A5FA" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central 3D Luminous Crystal Leaf / Spine Beacon -->
  <g filter="url(#glow-filter-04)">
    <!-- Left Crystal Facet -->
    <path d="M128 40L98 112L128 206V40Z" fill="url(#beam-prism-04)" />
    <!-- Right Crystal Facet -->
    <path d="M128 40L158 112L128 206V40Z" fill="url(#beam-right-facet-04)" />
    <!-- Crystal Center Spine Highlight -->
    <path d="M128 40V206" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M128 40L98 112L128 206L158 112L128 40Z" stroke="#E0F2FE" stroke-opacity="0.8" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
