<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- 12: Penguin/New Yorker Style 2D Ex-Libris Fountain Nib & Book Leaf -->
  <!-- Warm Archival Sage-Charcoal Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="#182226" />
  <rect x="28" y="28" width="200" height="200" rx="42" stroke="#D6C7B2" stroke-opacity="0.28" stroke-width="2" />

  <!-- Outer Engraved Oval Medallion -->
