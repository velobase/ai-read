  <circle cx="128" cy="124" r="9" fill="#182226" />

  <!-- Lower Half: Engraved Fanning Book Pages / Leaf Veins -->
  <path d="M128 132V208" stroke="#182226" stroke-width="5.5" />
  <path d="M92 146C106 150 118 158 128 170C138 158 150 150 164 146" stroke="#182226" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M88 166C104 170 118 178 128 190C138 178 152 170 168 166" stroke="#182226" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
