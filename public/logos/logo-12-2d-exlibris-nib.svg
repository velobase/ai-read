  <!-- Combined Fountain-Pen Nib (Top) + Botanical Leaf & Open Pages (Bottom) -->
  <path
    d="M128 42C154 78 176 112 176 146C176 174 155 196 128 208C101 196 80 174 80 146C80 112 102 78 128 42Z"
    fill="#F5F0E6"
  />

  <!-- Left Half Warm Brass-Gold Accent Plane (2D Split-Tone Engraving) -->
