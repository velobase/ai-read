name: Build LeafRead

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: leafread-production-build
  cancel-in-progress: false

env:
  REGISTRY: us-west1-docker.pkg.dev/project-5d0aab6e-1e10-4d20-952/leafread

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/92679730953/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: leafread-build@project-5d0aab6e-1e10-4d20-952.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime and migration images from the same commit
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for target in runtime migrate; do
            docker buildx build --platform linux/amd64 --target "$target" \
              --label "org.opencontainers.image.revision=$VERSION" \
              --tag "$REGISTRY/$target:sha-$VERSION" --push .
          done
          # GitOps selects this exact commit's two image digests; no mutable alias is needed.
          printf 'Built release `%s`. Promote it with the LeafRead GitOps release workflow.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
